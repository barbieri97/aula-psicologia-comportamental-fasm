name: Publicar aulas no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publicação por artefato do Actions: o job de build empacota o dist/ e o job de deploy
# entrega esse artefato ao Pages. Exige Settings → Pages → Source: "GitHub Actions" —
# com a fonte em "Deploy from a branch" o `configure-pages` falha logo no início.
permissions:
  contents: read   # checkout
  pages: write     # publicar no Pages
  id-token: write  # OIDC que o deploy-pages usa para se autenticar

# Uma publicação por vez, sem cancelar a que já está rodando: cancelar no meio deixa
# implantação pendente no Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # O `download: true` no headmatter faz o `slidev build` exportar o PDF de cada aula, e
      # essa exportação roda em Playwright. O `npm ci` já baixa o Chromium (postinstall do
      # playwright-chromium); aqui entram só as libs de sistema que ele carrega no runner.
      - name: Dependências de sistema do Chromium
        run: npx playwright install-deps chromium

      # Descobre a URL pública do site. O output `base_path` é o caminho dela:
      # "/<nome-do-repo>" num repo comum, "/" num repo <usuario>.github.io.
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6

      # SITE_BASE vira o --base de cada deck. O nome do repositório faz parte das URLs
      # do Pages — por isso ele vem do passo acima e não fica hardcoded.
      - name: Build das aulas
        run: node scripts/build-site.mjs
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # Além da landing, cada aula precisa do seu PDF: sem ele o botão de baixar os slides
      # aponta para um 404 e o site sobe assim mesmo — melhor falhar aqui.
      - name: Conferir o dist/
        run: |
          test -f dist/index.html || { echo "dist/index.html não existe — build falhou?"; exit 1; }
          for deck in aulas/*.md; do
            grep -q '^download: *true' "$deck" || continue
            slug=$(basename "$deck" .md)
            test -s "dist/$slug/slidev-exported.pdf" || { echo "dist/$slug/slidev-exported.pdf não existe — a exportação em PDF falhou"; exit 1; }
          done

      - name: Empacotar o dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v5
